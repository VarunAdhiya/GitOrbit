name: GitOrbit checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: gitorbit, POSTGRES_PASSWORD: gitorbit, POSTGRES_DB: gitorbit_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U gitorbit -d gitorbit_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://gitorbit:gitorbit@localhost:5432/gitorbit_test
      DIRECT_URL: postgresql://gitorbit:gitorbit@localhost:5432/gitorbit_test
      TEST_DATABASE_URL: postgresql://gitorbit:gitorbit@localhost:5432/gitorbit_test
      TEST_REDIS_URL: redis://localhost:6379/1
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
