name: gitorbit-test
services:
  postgres:
    image: postgres:18-alpine
    environment:
      { POSTGRES_USER: gitorbit, POSTGRES_PASSWORD: gitorbit, POSTGRES_DB: gitorbit_test }
    ports: ['127.0.0.1:55432:5432']
    tmpfs: ['/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gitorbit -d gitorbit_test']
      interval: 2s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7.4-alpine
    ports: ['127.0.0.1:56379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 15
